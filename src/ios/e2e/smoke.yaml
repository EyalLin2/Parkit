# End-to-end smoke test: a new driver from first launch through every main screen, on a
# simulator against the real backend, in English. Runs in CI (ios-ci.yml). Modelled on
# src/android/e2e/smoke.yaml; the Hebrew run is smoke-he.yaml.
appId: com.parkit.israel
---
- launchApp:
    clearState: true
    permissions:
      all: unset

# Intro: Hebrew by default, English on request
- assertVisible: "English"
- takeScreenshot: 00-first-launch-hebrew
- tapOn: "English"
- assertVisible: "How it works"
- takeScreenshot: 01-welcome
- tapOn: "How it works"
- takeScreenshot: 02-intro-slide
- repeat:
    while:
      visible: "Next"
    times: 8
    commands:
      - tapOn: "Next"
- tapOn: "Let's go"

# Sign in with the fixed test code (REVIEW_LOGIN in the workflow)
- assertVisible: "Send code"
- takeScreenshot: 03-login
- tapOn:
    id: "login_email"
- inputText: "e2e@parkit.dev"
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the code"
    timeout: 15000
- takeScreenshot: 04-code
- tapOn:
    id: "login_code"
- inputText: "246810"

# First-time details. The address just proved is shown and locked.
- extendedWaitUntil:
    visible: "Welcome to ParkIt!"
    timeout: 15000
- takeScreenshot: 05-details-top
- scrollUntilVisible:
    element:
      id: "details_email"
    direction: DOWN
- tapOn:
    id: "details_first"
- inputText: "Test"
- pressKey: Enter
- inputText: "Driver"
- pressKey: Enter
- takeScreenshot: 06-details-email-locked
- tapOn: "Save and continue"

# Car onboarding and tips
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- takeScreenshot: 07-car-onboarding
- tapOn: "Skip"
- takeScreenshot: 08-tips
- repeat:
    while:
      notVisible: "Got it, let's go"
    times: 8
    commands:
      - tapOn: "Next"
- tapOn: "Got it, let's go"

# Location: the explanation first, then iOS's own prompt
- extendedWaitUntil:
    visible: "Where are you now?"
    timeout: 15000
- takeScreenshot: 09-location-explained
- tapOn: "Continue"
- tapOn:
    text: "Allow While Using App"
    optional: true

# Map: pin, address, chips, seeded spots
- extendedWaitUntil:
    visible: "Report"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Dizengoff.*"
    timeout: 20000
- assertVisible: "Can I park?"
- assertNotVisible: ".*PK-[0-9]+.*"
- takeScreenshot: 10-map
- tapOn: "Car parks"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- takeScreenshot: 11-map-car-parks
- tapOn: "Car parks"

# The list, then a spot's card and the report-content choice
- swipe:
    start: "50%,86%"
    end: "50%,40%"
- takeScreenshot: 12-nearby-list
- tapOn:
    id: "spot_row_0"
- assertVisible: "On my way.*"
- takeScreenshot: 13-spot-sheet
- tapOn: "Report offensive content or user"
- assertVisible: "What's wrong?"
- takeScreenshot: 14-report-content
- tapOn: "Something else"
- extendedWaitUntil:
    visible: "Thanks, your report was sent.*"
    timeout: 10000
- takeScreenshot: 15-report-content-sent

# Claim: navigation opens outside the app (Maps here, Waze on a phone that has it)
- extendedWaitUntil:
    notVisible: "Thanks, your report was sent.*"
    timeout: 10000
- repeat:
    while:
      notVisible:
        id: "spot_row_1"
    times: 3
    commands:
      - swipe:
          start: "50%,86%"
          end: "50%,40%"
- tapOn:
    id: "spot_row_1"
- tapOn: "On my way.*"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 4000
    optional: true
# Maps asks for location itself, and its prompt would stay over the app. Refusing also
# avoids the second prompt it shows once allowed. (iOS writes a curly apostrophe.)
- tapOn:
    text: "Don.t Allow"
    optional: true
- takeScreenshot: 16-navigation-opened
- launchApp:
    stopApp: false
# Close to the spot already: "did you park here?" comes up by itself.
- extendedWaitUntil:
    visible: "Did you park here?"
    timeout: 15000
- takeScreenshot: 17-did-you-park-here
- tapOn: "Not this one"
- extendedWaitUntil:
    visible: "You're on your way"
    timeout: 8000
- takeScreenshot: 18-trip-card
- tapOn: "Never mind, let it go"
- extendedWaitUntil:
    notVisible: "You're on your way"
    timeout: 8000
- takeScreenshot: 19-let-it-go

# Again, and this time yes
- repeat:
    while:
      notVisible:
        id: "spot_row_1"
    times: 3
    commands:
      - swipe:
          start: "50%,86%"
          end: "50%,40%"
- tapOn:
    id: "spot_row_1"
- tapOn: "On my way.*"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 4000
    optional: true
- tapOn:
    text: "Don.t Allow"
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Did you park here?"
    timeout: 15000
- tapOn: "I parked here"

# Parked: offered the payment apps, then the car line and "I'm leaving"
- extendedWaitUntil:
    visible: "It's free, no need"
    timeout: 10000
- takeScreenshot: 20-parked-pay
- tapOn: "It's free, no need"
- extendedWaitUntil:
    visible: "I'm leaving"
    timeout: 10000
- takeScreenshot: 21-parked-car
- tapOn: "I'm leaving"
- extendedWaitUntil:
    visible: "Thanks! \\+15 points.*"
    timeout: 10000
- takeScreenshot: 22-left-spot-handed-on
- repeat:
    while:
      notVisible: ".*A driver just left.*"
    times: 3
    commands:
      - swipe:
          start: "50%,86%"
          end: "50%,40%"
- takeScreenshot: 23-driver-just-left

# Parked again by hand, which takes the spot back; then end it without handing on
- tapOn: "Parked"
- extendedWaitUntil:
    visible: "Save my car here"
    timeout: 8000
- takeScreenshot: 24-parked-explained
- tapOn: "Save my car here"
- extendedWaitUntil:
    visible: "It's free, no need"
    timeout: 8000
- tapOn: "It's free, no need"
- tapOn: "My car"
- extendedWaitUntil:
    visible: "End parking"
    timeout: 8000
- takeScreenshot: 25-car-sheet
- tapOn: "End parking"
- tapOn: "Just end"

# The 150 m rule: the pin far from the phone can't be reported
- swipe:
    start: "50%,62%"
    end: "10%,25%"
- swipe:
    start: "50%,62%"
    end: "10%,25%"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- tapOn: "Report"
- extendedWaitUntil:
    visible: "You can only report a spot that's near you"
    timeout: 8000
- takeScreenshot: 26-too-far
- tapOn: "Go to me"

# Report flow: photo (a drawn picture on a simulator, it has no camera) and the server's
# blur, then the required curb choice, then POST /spots. One report per 30 s.
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 31000
    optional: true
- tapOn: "Report"
- extendedWaitUntil:
    visible: "Report a free spot"
    timeout: 8000
- assertVisible: "Leaving your spot now? One tap, no photo"
- takeScreenshot: 27-report-sheet
- tapOn: "Take a photo of the spot"
- extendedWaitUntil:
    visible: "Choose the curb colour to continue"
    timeout: 30000
- takeScreenshot: 28-report-send-off-until-curb
- tapOn: "Gray \\(free\\)"
- tapOn: "More details \\(optional\\)"
- takeScreenshot: 29-report-more-details
- scrollUntilVisible:
    element:
      id: "report_note"
    direction: DOWN
- tapOn:
    id: "report_note"
- inputText: "Low curb e2e"
- tapOn: "Note for the next driver.*"
- scrollUntilVisible:
    element: "Confirm Report"
    direction: DOWN
- takeScreenshot: 30-report-ready
- tapOn: "Confirm Report"
- extendedWaitUntil:
    visible: "Spot reported"
    timeout: 15000
- takeScreenshot: 31-reported

# Another driver parks there: the reporter hears about it on the next start
- runScript: helped.js
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "A spot you reported helped a driver.*"
    timeout: 20000
- takeScreenshot: 32-helped-thanks

# "Leaving now" with no saved car, from somewhere new (same-spot reports are limited)
- setLocation:
    latitude: 32.0880
    longitude: 34.7818
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 31000
    optional: true
- tapOn: "Report"
- extendedWaitUntil:
    visible: "Go to me|Report a free spot"
    timeout: 8000
- runFlow:
    when:
      visible: "Go to me"
    commands:
      - tapOn: "Go to me"
      - extendedWaitUntil:
          visible: "Filter that never appears"
          timeout: 3000
          optional: true
      - tapOn: "Report"
- tapOn: "Leaving your spot now? One tap, no photo"
- extendedWaitUntil:
    visible: "Spot reported"
    timeout: 15000
- takeScreenshot: 33-leaving-now-sent

# Sign reader: answers from the sign seeded at the test location, then asks for a fresh read
- setLocation:
    latitude: 32.0853
    longitude: 34.7818
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 4000
    optional: true
- tapOn: "Can I park?"
- assertVisible: "Can I park here?"
- takeScreenshot: 34-sign-reader
- tapOn: "Snap a sign"
- extendedWaitUntil:
    visible: "Read earlier from a sign that looks the same here."
    timeout: 30000
- takeScreenshot: 35-sign-from-cache
- tapOn: "Remind me 10 min before .*"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: ".*We'll remind you at .*"
    timeout: 8000
- takeScreenshot: 36-reminder-set
- tapOn: "Not this sign? Read it again"
- extendedWaitUntil:
    visible: ".*PK-503.*"
    timeout: 30000
- takeScreenshot: 37-read-again-server-refused
- tapOn:
    point: "50%,10%"

# The reminder shows while parked and goes when the parking ends
- extendedWaitUntil:
    visible: "Parked"
    timeout: 8000
- tapOn: "Parked"
- extendedWaitUntil:
    visible: "It's free, no need"
    timeout: 8000
- tapOn: "It's free, no need"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 1500
    optional: true
- takeScreenshot: 38-parked-with-reminder
- tapOn: "My car"
- extendedWaitUntil:
    visible: "End parking"
    timeout: 8000
- tapOn: "End parking"
- tapOn: "Just end"
- extendedWaitUntil:
    visible: "Parked"
    timeout: 8000
- tapOn: "Parked"
- extendedWaitUntil:
    visible: "It's free, no need"
    timeout: 8000
- tapOn: "It's free, no need"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 1500
    optional: true
- takeScreenshot: 39-parked-reminder-gone
- tapOn: "My car"
- extendedWaitUntil:
    visible: "End parking"
    timeout: 8000
- tapOn: "End parking"
- tapOn: "Just end"

# Profile, rewards, league, reports
- extendedWaitUntil:
    visible: "My profile"
    timeout: 8000
- tapOn: "My profile"
- extendedWaitUntil:
    visible: ".*Test D.*"
    timeout: 15000
- takeScreenshot: 40-profile
- tapOn: "Rewards"
- extendedWaitUntil:
    visible: "points to spend"
    timeout: 15000
- assertNotVisible: ".*PK-[0-9]+.*"
- takeScreenshot: 41-rewards-characters
- tapOn: "Car"
- takeScreenshot: 42-rewards-car
- tapOn: "Themes"
- takeScreenshot: 43-rewards-themes
- tapOn: "Back"
- tapOn: "League"
- extendedWaitUntil:
    visible: "All of Israel|.*Israel.*"
    timeout: 10000
    optional: true
- takeScreenshot: 44-league
- tapOn: "Back"
- tapOn: "My reports"
- takeScreenshot: 45-my-reports
- tapOn: "Back"

# Settings: details (email locked), logout's question, account deletion
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "My details"
    timeout: 8000
- takeScreenshot: 46-settings
- tapOn: "My details"
- takeScreenshot: 47-my-details-email-locked
- tapOn: "Back"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- takeScreenshot: 48-settings-bottom
- tapOn: "Log out"
- takeScreenshot: 49-logout-question
- tapOn: "Cancel"
- tapOn: "Delete account"
- assertVisible: "Delete your account\\?"
- takeScreenshot: 50-delete-question
- tapOn: "Delete for good"

# Deleted: back at sign-in
- extendedWaitUntil:
    visible: "Send code"
    timeout: 15000
- takeScreenshot: 51-after-delete
