# Phones without an always-on display go dark when locked; Home wakes them. The parked-car
# notification is on the lock screen once something can be seen there.
appId: com.parkit.israel
---
- runFlow:
    when:
      notVisible: "הרכב שלך חונה|Your car is parked"
    commands:
      - pressKey: Home
      - extendedWaitUntil:
          visible: "הרכב שלך חונה|Your car is parked"
          timeout: 6000
          optional: true
