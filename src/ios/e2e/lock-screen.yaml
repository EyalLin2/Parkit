# The lock-screen "I'm leaving": a notification action that hands the spot on without
# opening the app. Follows smoke-he.yaml, so the driver is signed in and the app is in Hebrew.
# Outcomes as on Android: too far, thanks, stop-paying reminder.
appId: com.parkit.israel
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "דווח"
    timeout: 20000
- tapOn: "חניתי"
- extendedWaitUntil:
    visible: "שמור את הרכב כאן"
    timeout: 8000
- tapOn: "שמור את הרכב כאן"
- extendedWaitUntil:
    visible: "חינם, לא צריך"
    timeout: 8000
- tapOn: "חינם, לא צריך"
- extendedWaitUntil:
    visible: "יוצא מהחניה"
    timeout: 8000
- takeScreenshot: ls-01-parked-in-app

# Walked far from the car, then out of the app and on to the lock screen
- setLocation:
    latitude: 32.1100
    longitude: 34.7818
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 4000
    optional: true
- pressKey: Lock
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- runFlow:
    file: wake-lock-screen.yaml
- takeScreenshot: ls-02-lock-screen
- longPressOn: "הרכב שלך חונה"
- extendedWaitUntil:
    visible: "יוצא מהחניה"
    timeout: 6000
- takeScreenshot: ls-03-action
- tapOn: "יוצא מהחניה"
- extendedWaitUntil:
    visible: ".*נראה שאתם לא ליד הרכב.*"
    timeout: 25000
- takeScreenshot: ls-04-too-far

# Back by the car: the same action now hands the spot on
- setLocation:
    latitude: 32.0853
    longitude: 34.7818
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 4000
    optional: true
- longPressOn: "הרכב שלך חונה"
- extendedWaitUntil:
    visible: "יוצא מהחניה"
    timeout: 6000
- tapOn: "יוצא מהחניה"
- extendedWaitUntil:
    visible: "תודה, החניה על המפה"
    timeout: 25000
- takeScreenshot: ls-05-thanks

# In the app the car is gone: it was handed on from the lock screen.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "דווח"
    timeout: 20000
- assertVisible: "חניתי"
- takeScreenshot: ls-06-app-after

# Paid for the parking this time: leaving reminds to stop paying. One report per 30 s.
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 31000
    optional: true
- tapOn: "חניתי"
- extendedWaitUntil:
    visible: "פנגו"
    timeout: 8000
- tapOn: "פנגו"
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "יוצא מהחניה"
    timeout: 10000
- pressKey: Lock
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- runFlow:
    file: wake-lock-screen.yaml
- longPressOn: "הרכב שלך חונה"
- extendedWaitUntil:
    visible: "יוצא מהחניה"
    timeout: 6000
- tapOn: "יוצא מהחניה"
- extendedWaitUntil:
    visible: ".*אל תשכחו לעצור את תשלום החניה.*"
    timeout: 25000
- takeScreenshot: ls-07-stop-paying

# The same in English, after switching language in Settings
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "דווח"
    timeout: 20000
- tapOn: "הפרופיל שלי"
- extendedWaitUntil:
    visible: "הגדרות"
    timeout: 10000
- tapOn: "הגדרות"
- tapOn: "שפה"
- tapOn: "English"
- extendedWaitUntil:
    visible: "Report"
    timeout: 20000
- takeScreenshot: ls-08-english-map
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 31000
    optional: true
- tapOn: "Parked"
- extendedWaitUntil:
    visible: "It's free, no need"
    timeout: 8000
- tapOn: "It's free, no need"
- extendedWaitUntil:
    visible: "I'm leaving"
    timeout: 8000
- pressKey: Lock
- extendedWaitUntil:
    visible: "Filter that never appears"
    timeout: 3000
    optional: true
- runFlow:
    file: wake-lock-screen.yaml
- takeScreenshot: ls-09-english-lock-screen
- longPressOn: "Your car is parked"
- extendedWaitUntil:
    visible: "I'm leaving"
    timeout: 6000
- takeScreenshot: ls-10-english-action
- tapOn: "I'm leaving"
- extendedWaitUntil:
    visible: "Thanks, the spot is on the map"
    timeout: 25000
- takeScreenshot: ls-11-english-thanks
- launchApp:
    stopApp: true
