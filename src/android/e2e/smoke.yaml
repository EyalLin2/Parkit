# End-to-end smoke test: a new driver from first launch to every main screen,
# on a real emulator against the real backend. Runs in CI (android-ci.yml).
appId: com.parkit.israel
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Intro
- tapOn:
    text: "English"
    optional: true
- tapOn: "How it works"
- repeat:
    while:
      visible: "Next"
    times: 8
    commands:
      - tapOn: "Next"
- tapOn: "Let's go"
- takeScreenshot: 01-login

# Sign in with the fixed test code (REVIEW_LOGIN in the workflow)
- tapOn: "Email"
- inputText: "e2e@parkit.dev"
- hideKeyboard
- tapOn: "Send code"
- assertVisible: "Enter the code"
- tapOn:
    below:
      text: "We sent it to.*"
- inputText: "246810"

# First-time details. The address just proved is shown and locked.
- extendedWaitUntil:
    visible: "Welcome to ParkIt!"
    timeout: 15000
- scrollUntilVisible:
    element: "First name"
    direction: DOWN
- tapOn: "First name"
- inputText: "Test"
- hideKeyboard
- scrollUntilVisible:
    element: "Last name"
    direction: DOWN
- tapOn: "Last name"
- inputText: "Driver"
- hideKeyboard
- takeScreenshot: 02-details
- tapOn: ".*(Continue|Save|continue).*"

# Car onboarding and tips
- extendedWaitUntil:
    visible: "Skip"
    timeout: 15000
- tapOn: "Skip"
- repeat:
    while:
      notVisible: "Got it, let's go"
    times: 8
    commands:
      - tapOn: "Next"
- tapOn: "Got it, let's go"

# Map
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Report"
    timeout: 20000
- assertVisible: "Can I park?"
- assertNotVisible: ".*PK-[0-9]+.*"
- takeScreenshot: 03-map

# Report sheet opens, with the camera as the required first step
- tapOn: "Report"
- assertVisible: "Report a free spot"
- takeScreenshot: 04-report
- back

# Sign reader opens
- tapOn: "Can I park?"
- assertVisible: "Can I park here?"
- takeScreenshot: 05-sign
- back

# Profile, then the rewards shop loads from the server
- tapOn: "My profile"
- assertVisible: ".*Test D\\..*"
- takeScreenshot: 06-profile
- tapOn: "Rewards"
- extendedWaitUntil:
    visible: "To spend.*|.*to spend.*"
    timeout: 10000
    optional: true
- assertNotVisible: ".*PK-[0-9]+.*"
- takeScreenshot: 07-rewards
- back

# My details: the sign-in email can't be edited
- assertVisible: ".*Test D\\..*"

# Daily loop: park, then hand the spot on
- back
- tapOn: "Parked"
- tapOn: "Save my car here"
- tapOn:
    text: "It's free, no need"
    optional: true
- extendedWaitUntil:
    visible: "My car"
    timeout: 10000
- takeScreenshot: 08-parked
- tapOn: "I'm leaving"
- extendedWaitUntil:
    visible: "Parked"
    timeout: 30000
- assertNotVisible: ".*PK-[0-9]+.*"
- takeScreenshot: 09-left


# Take someone's spot, then change your mind
- swipe:
    start: "50%,88%"
    end: "50%,35%"
- tapOn: "Regular spot ·.*ago.*"
- tapOn: "On my way · Navigate"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Never mind, let it go"
    timeout: 15000
- takeScreenshot: 10-trip
- tapOn: "Never mind, let it go"
- extendedWaitUntil:
    notVisible: "Never mind, let it go"
    timeout: 10000
- assertNotVisible: ".*PK-[0-9]+.*"

# Settings, then log out
- tapOn: "My profile"
- extendedWaitUntil:
    visible: ".*Test D\\..*"
    timeout: 10000
- tapOn: "Settings"
- tapOn: "My details"
- assertVisible: "Email"
- takeScreenshot: 11-details
- back
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
- takeScreenshot: 12-settings
- tapOn: "Log out"
- assertVisible: "Log out?"
- tapOn: "Log out"
- extendedWaitUntil:
    visible: "Send code"
    timeout: 10000
- takeScreenshot: 13-logged-out
