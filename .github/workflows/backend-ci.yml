name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the run that's now out of date.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parkit
          POSTGRES_PASSWORD: parkit_dev_password
          POSTGRES_DB: parkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkit -d parkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parkit:parkit_dev_password@localhost:5432/parkit_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # The tests build tables straight from the models, so they'd never notice a
  # broken migration. This replays every migration on an empty database —
  # exactly what a restore or a new server does.
  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parkit
          POSTGRES_PASSWORD: parkit_dev_password
          POSTGRES_DB: parkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkit -d parkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parkit:parkit_dev_password@localhost:5432/fresh
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
      PGPASSWORD: parkit_dev_password
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r requirements.txt
      # A brand-new database: PostGIS is NOT pre-enabled here, like on a new server.
      - run: psql -h localhost -U parkit -d parkit -c "CREATE DATABASE fresh"
      - run: alembic upgrade head
      - name: Downgrade one step and back up again
        run: alembic downgrade -1 && alembic upgrade head

  # The image production runs. Catches a broken Dockerfile or a dependency
  # that won't install, before it reaches the server.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: src/backend
          push: false
          tags: parkit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
