name: Android CI

# Only when the app changes: a backend-only PR shouldn't wait for Gradle.
on:
  push:
    branches: [main]
    paths: ["src/android/**", "src/backend/**", "deployments/docker/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["src/android/**", "src/backend/**", "deployments/docker/**", ".github/workflows/android-ci.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.14 runs on JDK 21 (25 is too new for it) — same as local builds.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Debug build: proves the app compiles. Lint: Android-specific bugs
      # (missing translations, API-level misuse, accessibility).
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: src/android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: parkit-debug-apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # The app on a real emulator against the real backend: first launch, sign-in
  # and every main screen. Screenshots and Maestro's debug output are uploaded.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the backend
        run: |
          cp .env.example .env
          printf '\nREVIEW_LOGIN=e2e@parkit.dev:246810\n' >> .env
          compose="docker compose -f deployments/docker/docker-compose.yml --env-file .env"
          $compose up -d --build
          $compose exec -T backend alembic upgrade head
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && exit 0; sleep 2; done
          $compose logs backend
          exit 1
      - name: Build the app
        working-directory: src/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=1.39.13 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install src/android/app/build/outputs/apk/debug/app-debug.apk
            adb emu geo fix 34.7818 32.0853
            mkdir -p e2e-output
            cd e2e-output && maestro test --debug-output=debug ../src/android/e2e/smoke.yaml
      - name: Backend log
        if: failure()
        run: docker compose -f deployments/docker/docker-compose.yml --env-file .env logs --tail=100 backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output
          retention-days: 7
